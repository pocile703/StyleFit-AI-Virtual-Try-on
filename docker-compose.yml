# StyleFit AI — dev-parity stack. One command: `docker compose up --build`.
# Source is bind-mounted for hot-reload; node_modules/.next are masked by
# anonymous volumes so the host's (possibly cross-platform) copies never leak
# into the container.
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000" # REQUIRED: the browser hits :4000 directly (see frontend/lib/api.ts)
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-stylefit-dev-secret-change-in-production}
      - FASHN_API_KEY=${FASHN_API_KEY:-} # unset -> sharp mock try-on path
      # All unset locally. Set them in the root .env to run the stack exactly as
      # production does — the same hosted database, image store and sign-up gate.
      - MONGODB_URI=${MONGODB_URI:-} # unset -> data/db.json
      - CLOUDINARY_URL=${CLOUDINARY_URL:-} # unset -> uploads/ on disk
      - SIGNUP_INVITE_CODES=${SIGNUP_INVITE_CODES:-} # unset -> open registration
      - TRYON_DAILY_GLOBAL_CAP=${TRYON_DAILY_GLOBAL_CAP:-} # unset -> no daily cap
    volumes:
      - ./backend:/app # source + data/db.json + uploads persistence
      - /app/node_modules # anon volume: keep container's linux modules

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-}
      - WATCHPACK_POLLING=true # reliable hot-reload over bind mounts (Mac/Windows)
    volumes:
      - ./frontend:/app
      - /app/node_modules # anon volume
      - /app/.next # anon volume: build cache
    depends_on:
      - backend
